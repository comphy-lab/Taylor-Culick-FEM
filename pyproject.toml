[project]
name = "taylor-culick-fem"
version = "0.1.0"
description = "Sharp-interface FEM study of Taylor-Culick sheet retraction in a tip co-moving frame"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Vatsal Sanjay", email = "vatsal.sanjay@comphy-lab.org" }]

dependencies = [
    "pyoomph",
    "numpy>=1.24.4",
    "scipy>=1.10.1",
    "matplotlib>=3.7.5",
    "meshio>=5.3.4",
    "pygmsh>=7.1.17",
    "gmsh>=4.11",
    # Required because pyoomph is built with PYOOMPH_USE_MPI=ON (see below);
    # the MPI-enabled build imports mpi4py at runtime.
    "mpi4py>=3.1",
]

# pyoomph is taken from an immutable CoMPhy release commit, not PyPI. It is a
# source build: CMake compiles vendored oomph-lib plus downloaded CLN/GiNaC.
[tool.uv.sources]
pyoomph = { git = "https://github.com/comphy-lab/pyoomph", rev = "a186e07e1a7ea6b74ecc4f3a3fc39cc763d41618" }

# MPI is REQUIRED, not optional. src/nanobind/mesh.cpp calls
# oomph::GeneralisedElement::is_halo(), which oomph-lib only declares under
# OOMPH_HAS_MPI, so an MPI-off build of develop fails to compile. This mirrors
# what upstream's own build_for_develop.sh does.
[tool.uv]
# This repository is a set of simulation cases and evidence scripts, not a
# library: there is nothing to install into the environment. Scripts add the
# directory they need to sys.path explicitly.
package = false
config-settings-package = { pyoomph = { "cmake.define.PYOOMPH_USE_MPI" = "ON", "build.tool-args" = "-j8" } }

[dependency-groups]
dev = [
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
pyoomph-build = [
    "nanobind==2.9.2",
    "scikit-build-core==0.11.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
